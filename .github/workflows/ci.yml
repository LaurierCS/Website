name: CI

on:
  push:
    branches: ['**']

jobs:
  site:
    name: Site (Astro)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/site

      - name: Run TypeScript check
        run: pnpm exec astro check
        working-directory: apps/site

      - name: Build
        run: pnpm build
        working-directory: apps/site

  admin:
    name: Admin (Vite + React)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/admin

      - name: Run linter
        run: pnpm lint
        working-directory: apps/admin

      - name: Run TypeScript type check
        run: pnpm exec tsc -b --noEmit
        working-directory: apps/admin

      - name: Build
        run: pnpm build
        working-directory: apps/admin
