name: CI

on:
  push:
    branches: ['**']

# One pnpm workspace: install once at the root, then check each app.
jobs:
  site:
    name: Site (Astro)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The pnpm version comes from `packageManager` in the root package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm --dir apps/site exec astro check

      - name: Build
        run: pnpm --dir apps/site build

  admin:
    name: Admin (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm --dir apps/admin lint

      - name: Run TypeScript type check
        run: pnpm --dir apps/admin exec tsc -b --noEmit

      - name: Run tests
        run: pnpm --dir apps/admin test

      - name: Build
        run: pnpm --dir apps/admin build
